[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-support-resolution"
version = "0.1.0"
description = "Production-grade support-resolution agent on LangGraph: classify -> retrieve -> draft -> policy-as-code check -> confidence gate -> human approval for anything risky -> simulated send, with a full audit trail. Mock-first: no API key, no network."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Bala Sai Kunapareddi" }]
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
live = ["langchain-google-genai>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
support-resolution-demo = "agent_support_resolution.demo:main"
support-resolution-evals = "agent_support_resolution.evals:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
